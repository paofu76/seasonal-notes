[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seasonal-notes"
version = "0.2.0"
description = "四季主题的本地桌面笔记应用"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1", "pyinstaller>=6,<7"]

[project.gui-scripts]
seasonal-notes = "seasonal_notes.application:main"

[tool.setuptools.packages.find]
include = ["seasonal_notes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
